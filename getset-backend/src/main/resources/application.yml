spring:
  application:
    name: getset-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/getset}
      auto-index-creation: true

    elasticsearch:
      uris: ${ELASTICSEARCH_HOST:http://localhost:9200}
      socket-timeout: 60000
      connection-timeout: 5000

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000  # 24 hours in milliseconds
      refresh-expiration: 604800000 # 7 days in milliseconds

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: getset-scheduler-

  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: getset-notification-consumers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.getset.events"

server:
  port: 8080
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  # Distributed tracing (Micrometer + Brave → Zipkin)
  tracing:
    sampling:
      probability: 1.0    # 100% in dev; overridden to 0.1 in prod profile
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active:default}

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
  use-fqn: false
  cache:
    disabled: false
  writer-with-default-pretty-printer: false
  use-management-port: false

logging:
  level:
    "[com.getset]": INFO
    "[org.springframework.security]": WARN
    "[org.springframework.data.mongodb]": WARN
    "[io.github.resilience4j]": INFO
    "[springdoc]": WARN
    "[org.springdoc]": WARN

# Resilience4J Configuration
resilience4j:
  retry:
    instances:
      userRepository:
        maxAttempts: 3
        wait-duration: 100
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - java.lang.IllegalArgumentException
  
  circuitbreaker:
    instances:
      userRepository:
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2000
        waitDurationInOpenState: 30000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - java.lang.IllegalArgumentException
      
      propertyRepository:
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2000
        waitDurationInOpenState: 30000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  
  timelimiter:
    instances:
      authService:
        timeoutDuration: 5000
        cancelRunningFuture: true

  ratelimiter:
    instances:
      authService:
        limitForPeriod: 10
        limitRefreshPeriod: 1m
        timeoutDuration: 500ms


      propertyService:
        timeoutDuration: 5000
        cancelRunningFuture: true

