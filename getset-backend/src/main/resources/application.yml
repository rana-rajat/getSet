spring:
  application:
    name: getset-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/getset}
      auto-index-creation: true

    elasticsearch:
      uris: ${ELASTICSEARCH_HOST:http://localhost:9200}
      socket-timeout: 60000
      connection-timeout: 5000

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  jwt:
    secret-key: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters}
    expiration: 86400000  # 24 hours in milliseconds

  security:
    jwt:
      secret-key: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters}
      expiration: 86400000  # 24 hours in milliseconds

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: getset-scheduler-

server:
  port: 8080
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
  use-fqn: false
  cache:
    disabled: false
  writer-with-default-pretty-printer: false
  use-management-port: false

logging:
  level:
    "[com.getset]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.springframework.data.mongodb]": DEBUG
    "[io.github.resilience4j]": INFO
    "[springdoc]": TRACE
    "[org.springdoc]": TRACE
    "[org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping]": DEBUG
    "[org.springframework.web.servlet.DispatcherServlet]": DEBUG
    "[org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor]": DEBUG

# Resilience4J Configuration
resilience4j:
  retry:
    instances:
      userRepository:
        maxAttempts: 3
        wait-duration: 100
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - java.lang.IllegalArgumentException
  
  circuitbreaker:
    instances:
      userRepository:
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2000
        waitDurationInOpenState: 30000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - java.lang.IllegalArgumentException
      
      propertyRepository:
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2000
        waitDurationInOpenState: 30000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  
  timelimiter:
    instances:
      authService:
        timeoutDuration: 5000
        cancelRunningFuture: true


      propertyService:
        timeoutDuration: 5000
        cancelRunningFuture: true

