
services:
  # ── Databases & Storage ────────────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: getset-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - getset-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: getset-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - getset-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka ──────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: getset-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - getset-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: getset-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - getset-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Observability ─────────────────────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: getset-zipkin
    ports:
      - "9411:9411"
    networks:
      - getset-network

  prometheus:
    image: prom/prometheus:latest
    container_name: getset-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - getset-network

  grafana:
    image: grafana/grafana:latest
    container_name: getset-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - getset-network

  # ── Microservices ─────────────────────────────────────────────────────────
  user-service:
    build: ./user-service
    container_name: getset-user-service
    expose:
      - "8081"
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/getset_users?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - getset-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  property-service:
    build: ./property-service
    container_name: getset-property-service
    expose:
      - "8082"
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/getset_properties?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8081
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mongodb:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - getset-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  enquiry-service:
    build: ./enquiry-service
    container_name: getset-enquiry-service
    expose:
      - "8083"
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/getset_enquiries?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER: kafka:9092
      USER_SERVICE_URL: http://user-service:8081
      PROPERTY_SERVICE_URL: http://property-service:8082
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
      property-service:
        condition: service_healthy
    networks:
      - getset-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  message-service:
    build: ./message-service
    container_name: getset-message-service
    expose:
      - "8084"
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/getset_messages?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER: kafka:9092
      USER_SERVICE_URL: http://user-service:8081
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - getset-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  notification-service:
    build: ./notification-service
    container_name: getset-notification-service
    expose:
      - "8085"
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/getset_notifs?authSource=admin
      KAFKA_BROKER: kafka:9092
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - getset-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  favorite-service:
    build: ./favorite-service
    container_name: getset-favorite-service
    expose:
      - "8086"
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/getset_favs?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      PROPERTY_SERVICE_URL: http://property-service:8082
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mongodb:
        condition: service_healthy
      property-service:
        condition: service_healthy
    networks:
      - getset-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: getset-api-gateway
    ports:
      - "8090:8090"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:8081
      PROPERTY_SERVICE_URL: http://property-service:8082
      ENQUIRY_SERVICE_URL: http://enquiry-service:8083
      MESSAGE_SERVICE_URL: http://message-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      FAVORITE_SERVICE_URL: http://favorite-service:8086
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      property-service:
        condition: service_healthy
    networks:
      - getset-network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  getset-network:
    driver: bridge
